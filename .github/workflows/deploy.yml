name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧运行自动取消，连续推送时不排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 构建门禁：三端必须全部构建通过，deploy 才会执行
  #
  # 这个 job 是补上来的。此前本仓库唯一的 workflow 只有 SSH 部署一步，
  # 没有任何构建/类型检查，导致 portal 的一个类型错误在 main 上躺了
  # 111 天无人发现，而部署流水线自建立起就没成功构建过 portal。
  # ─────────────────────────────────────────────────────────────
  verify:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false        # 一个挂了也要看到另外两个的结果
      matrix:
        project: [backend, frontend, portal]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'   # 与三个 Dockerfile 的 node:20-alpine 保持一致
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install (npm ci)
        working-directory: ${{ matrix.project }}
        run: npm ci

      # backend: nest build / frontend: tsc && vite build / portal: next build
      # 三者都含类型检查，构建通过即等价于 tsc 通过
      - name: Build
        working-directory: ${{ matrix.project }}
        run: npm run build
        env:
          # portal 构建期读取；取值不影响产物结构，仅避免未定义告警
          NEXT_PUBLIC_API_BASE: http://localhost
          NEXT_PUBLIC_SITE_NAME: Prism

      # 单元测试（含评论公开接口 PII 回归：backend comment.service.spec.ts）
      # 目前只对 backend 启用：frontend 的 test 脚本是 vitest，但仓库里还没有任何
      # 测试文件，vitest 会报 "No test files found" 并以退出码 1 失败；portal 没有
      # test 脚本（--if-present 下为空操作）。frontend 补上测试后可去掉 if。
      # 不要加 --coverage：backend package.json 的全局 80% 覆盖率阈值会让它失败。
      - name: Test
        if: matrix.project == 'backend'
        working-directory: ${{ matrix.project }}
        run: npm test --if-present

  # ─────────────────────────────────────────────────────────────
  # 部署：仅在 verify 全绿、且是推送到 main 时执行
  # 未配置 SSH secrets 时优雅跳过（而非红叉），避免 CI 长期挂红
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: SSH Deploy
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检查部署 secrets 是否已配置
        id: gate
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_USER }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=已跳过部署::构建全部通过，但未配置 SSH_HOST / SSH_USER / SSH_PRIVATE_KEY，不执行部署。配置方法见 docs/deploy.md 第 8 节。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH || '/opt/prism-cms' }}

            echo "=== [1/6] 拉取最新代码 ==="
            # HTTPS 模式下 nginx/nginx.conf 是 render-nginx-conf.sh 的生成物（受 git 跟踪），
            # 不先还原的话，上游一改 nginx.conf，git pull 就会中止
            if [ -f nginx/ssl/fullchain.pem ]; then git checkout -- nginx/nginx.conf; fi
            if ! git pull origin main; then
              # 上一步已把 nginx.conf 还原成 HTTP 版，退出前按当前模式重新生成，
              # 否则 nginx 容器下次重启会以 HTTP 配置起来、443 不再监听
              bash scripts/render-nginx-conf.sh || echo "::warning::nginx/nginx.conf 重新生成失败，请登录服务器执行 bash scripts/render-nginx-conf.sh"
              echo "git pull 失败，部署中止"
              exit 1
            fi
            # 按当前模式生成 nginx/nginx.conf（HTTP 模式下什么也不做）
            bash scripts/render-nginx-conf.sh

            echo "=== [2/6] 安全检查 ==="
            if grep -q '^DB_SYNC=true' .env.prod 2>/dev/null; then
              echo "::warning::.env.prod 中 DB_SYNC=true —— TypeORM 会在容器启动时 ALTER 生产库，改类型或删列将静默丢数据。首次部署完成后应改回 false。"
            fi

            echo "=== [3/6] 构建并重启服务 ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --remove-orphans

            echo "=== [4/6] 等待 backend 健康 ==="
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' prism-backend 2>/dev/null || echo "none")
              if [ "$STATUS" = "healthy" ]; then
                echo "backend 就绪 (healthy)"
                break
              fi
              [ $i -eq 24 ] && { echo "backend 启动超时 (status=$STATUS)"; docker logs --tail 50 prism-backend; exit 1; }
              sleep 5
            done

            echo "=== [5/6] 校验并重建 nginx ==="
            # 单文件 bind mount：git pull 换了 inode，运行中的容器仍读旧文件，up -d 也不会重建 nginx；
            # 先在一次性容器里（与 compose 的 nginx 服务同网络、同挂载）用新文件跑 nginx -t，
            # 通过后再强制重建，同时让 upstream 重新解析新容器 IP。校验失败则中止，线上保持旧配置。
            NET=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.NetworkID}} {{end}}' prism-backend | awk '{print $1}') \
              || { echo "找不到 prism-backend 容器，无法确定 Docker 网络"; exit 1; }
            [ -n "$NET" ] || { echo "prism-backend 没有接入任何 Docker 网络"; exit 1; }
            mkdir -p nginx/ssl
            docker run --rm --network "$NET" \
              -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/nginx/ssl:/etc/nginx/ssl:ro" \
              -v prism_nginx_logs:/var/log/nginx \
              nginx:alpine nginx -t \
              || { echo "nginx 配置校验失败，未重建 nginx（线上仍是旧配置）"; exit 1; }
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps --force-recreate nginx

            echo "=== [6/6] 清理旧镜像 ==="
            docker image prune -f

            echo "部署完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Notify on failure
        if: failure()
        run: echo "::error::部署失败，请检查 Actions 日志。"
