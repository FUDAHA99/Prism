name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧运行自动取消，连续推送时不排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 构建门禁：三端必须全部构建通过，deploy 才会执行
  #
  # 这个 job 是补上来的。此前本仓库唯一的 workflow 只有 SSH 部署一步，
  # 没有任何构建/类型检查，导致 portal 的一个类型错误在 main 上躺了
  # 111 天无人发现，而部署流水线自建立起就没成功构建过 portal。
  # ─────────────────────────────────────────────────────────────
  verify:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false        # 一个挂了也要看到另外两个的结果
      matrix:
        project: [backend, frontend, portal]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'   # 与三个 Dockerfile 的 node:20-alpine 保持一致
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install (npm ci)
        working-directory: ${{ matrix.project }}
        run: npm ci

      # backend: nest build / frontend: tsc && vite build / portal: next build
      # 三者都含类型检查。注意 backend 的 nest build 用 tsconfig.build.json，不编译 *.spec.ts 与 src/common/testing：
      # 测试代码的类型检查由下面 Test 步骤的 ts-jest 负责，不要去掉 Test 步骤
      - name: Build
        working-directory: ${{ matrix.project }}
        run: npm run build
        env:
          # portal 构建期读取；取值不影响产物结构，仅避免未定义告警
          NEXT_PUBLIC_API_BASE: http://localhost
          NEXT_PUBLIC_SITE_NAME: Prism

      # 单元测试（含评论公开接口 PII 回归：backend comment.service.spec.ts；
      # frontend 退出登录在后台吊销 token 的回归：src/api/auth.test.ts，vitest 在 CI 下以 run 模式执行）。
      # portal 没有 test 脚本（--if-present 下为空操作），这里直接跳过。
      # 不要加 --coverage：backend package.json 的全局 80% 覆盖率阈值会让它失败。
      - name: Test
        if: matrix.project != 'portal'
        working-directory: ${{ matrix.project }}
        run: npm test --if-present

  # ─────────────────────────────────────────────────────────────
  # nginx 配置门禁：两份配置镜像一致，且两种模式渲染出的生效配置都能通过 nginx -t
  # 用的就是部署时跑的同一组脚本（render / check-nginx-conf / check-nginx-mirror），
  # 配置写错在这里就红，而不是等到服务器上部署时才发现
  # ─────────────────────────────────────────────────────────────
  nginx:
    name: Nginx config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # nginx.conf 与 nginx-ssl.conf 除 HTTPS 专属指令外必须一致（含 server 级安全头与全部 location）
      - name: 镜像校验
        run: bash scripts/check-nginx-mirror.sh

      - name: HTTP 模式：渲染 + nginx -t
        run: |
          bash scripts/render-nginx-conf.sh
          cmp nginx/nginx.active.conf nginx/nginx.conf
          bash scripts/check-nginx-conf.sh

      # 临时自签证书让 render 走 HTTPS 分支，并让 nginx -t 真正加载证书与私钥
      - name: HTTPS 模式：渲染 + nginx -t（临时自签证书）
        run: |
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=example.test" \
            -keyout nginx/ssl/privkey.pem -out nginx/ssl/fullchain.pem
          printf 'DOMAIN=https://example.test\n' > .env.prod
          test "$(bash scripts/render-nginx-conf.sh --print-domain)" = example.test
          bash scripts/render-nginx-conf.sh
          grep -q 'server_name example.test;' nginx/nginx.active.conf
          if grep -q PRISM_DOMAIN nginx/nginx.active.conf; then echo "::error::生成结果里还有 PRISM_DOMAIN 占位符"; exit 1; fi
          bash scripts/check-nginx-conf.sh

  # ─────────────────────────────────────────────────────────────
  # 部署：仅在 verify 与 nginx 全绿、且是推送到 main 时执行
  # 未配置 SSH secrets 时优雅跳过（而非红叉），避免 CI 长期挂红
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: SSH Deploy
    needs: [verify, nginx]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检查部署 secrets 是否已配置
        id: gate
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_USER }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=已跳过部署::构建全部通过，但未配置 SSH_HOST / SSH_USER / SSH_PRIVATE_KEY，不执行部署。配置方法见 docs/deploy.md 第 8 节。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          # 部署逻辑全部在 scripts/deploy.sh（与手工部署同一份）。这里先 git pull 再带 --skip-pull 调用，
          # 保证执行的是刚拉下来的新版 deploy.sh。
          # 注意：appleboy/ssh-action 底层的 drone-ssh 可能按 ASCII 逗号切分 script，本段不要出现半角逗号。
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH || '/opt/prism-cms' }}

            # 一次性迁移（见 docs/deploy.md 5.1 节）：旧版 setup-ssl.sh 把 HTTPS 配置写进了受跟踪的
            # nginx/nginx.conf；生效配置现在是生成的 nginx/nginx.active.conf，备份后还原它，否则 git pull 会中止
            BAK=""
            if ! git diff --quiet HEAD -- nginx/nginx.conf; then
              mkdir -p backup
              BAK="backup/nginx.conf.local.$(date +%Y%m%d-%H%M%S)"
              cp nginx/nginx.conf "$BAK"
              git checkout HEAD -- nginx/nginx.conf
              echo "nginx/nginx.conf 有本地改动：已备份到 $BAK 并还原"
            fi

            # 还在运行的旧 nginx 容器（旧版 compose）按路径挂载 nginx/nginx.conf：nginx 在新 compose 上重建成功之前
            # 任何失败都要把备份拷回，否则它下次被 start 时只剩 HTTP。deploy.sh 经 PRISM_NGINX_CONF_BACKUP 拿到备份
            # 自己负责；这里兜住 pull 失败和 deploy.sh 没能处理的情况（拷回总是安全的：下次部署会再迁移一次）
            restore_nginx_conf() {
              if [ -n "$BAK" ] && git diff --quiet HEAD -- nginx/nginx.conf; then
                if cp -f "$BAK" nginx/nginx.conf; then echo "已把 nginx/nginx.conf 恢复为迁移前的内容（备份 $BAK）"
                else echo "恢复 nginx/nginx.conf 失败！立即手工执行：cp -f $BAK nginx/nginx.conf"; fi
              fi
            }

            git pull origin main || { restore_nginx_conf; echo "git pull 失败：部署中止，容器均未改动"; exit 1; }

            PRISM_NGINX_CONF_BACKUP="$BAK" bash scripts/deploy.sh --skip-pull || { rc=$?; restore_nginx_conf; exit $rc; }

      - name: Notify on failure
        if: failure()
        run: echo "::error::部署失败，请检查 Actions 日志。"
