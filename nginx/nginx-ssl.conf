# Prism CMS — HTTPS 版反向代理配置（模板）
# 由 scripts/render-nginx-conf.sh 填入 .env.prod 的域名后生成 nginx/nginx.active.conf
#   （未跟踪，nginx 实际读取的就是它；setup-ssl.sh 首次生成，之后 deploy.sh 每次部署重新生成）
# 路由规则同 nginx.conf，额外增加 HTTP→HTTPS 强制跳转与 HSTS
#
# ⚠️ 除 HTTPS 专属指令（80→443 跳转 server、listen 443、ssl_*、HSTS）外必须与 nginx.conf 一致，
#    改一份必须同步另一份；提交前跑 bash scripts/check-nginx-mirror.sh（CI 也会跑）。
#    不要在服务器上手改本文件或生成物。

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    # 须 ≥ backend UPLOAD_MAX_SIZE + multipart 头部；backend 启动期强制 ≤ 11MiB
    client_max_body_size 12M;

    # ─── 信息泄露 ──────────────────────────────────────────
    server_tokens     off;            # Server 头/错误页不带版本号
    proxy_hide_header X-Powered-By;   # 去掉 portal 的 "X-Powered-By: Next.js"（backend 已由 helmet 去掉）

    # ─── 边缘限流 ──────────────────────────────────────────
    # 只挂在 location /api/ 上。绝不要挂到 server 级或 location /：
    #   portal 的 <Link> 预取会一次并发几十个 ?_rsc= 请求。
    # 按连接源 IP 计数：前置 CDN/云 LB 时必须先配 set_real_ip_from/real_ip_header，
    #   否则全体用户共用 CDN 出口 IP 的桶。
    # api 桶：单 IP 洪泛闸。burst=100 对齐后端 RATE_LIMIT_COUNT=100 / RATE_LIMIT_TTL=60000
    #   （docker-compose.prod.yml），保证后端会放行的流量 nginx 一定放行，两层不互相误杀；
    #   后端调大 RATE_LIMIT_COUNT 时这里同步调大 burst。
    # login 桶：后端 auth.controller 的 @Throttle ttl 仍是 60/300（throttler v5 下为毫秒），
    #   登录/注册在后端实际不限流，此桶是目前唯一有效的爆破防护。
    limit_req_zone $binary_remote_addr zone=api:10m   rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status    429;    # 默认 503
    limit_req_log_level warn;

    upstream backend  { server backend:3001;  }
    upstream portal   { server portal:3002;   }
    upstream frontend { server frontend:8080; }

    # ─── HTTP → HTTPS 强制跳转 ────────────────────────────────
    server {
        listen 80;
        server_name PRISM_DOMAIN;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS 主站点 ─────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name PRISM_DOMAIN;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头：加 always，让 4xx/5xx 与 nginx 自身的 429 也带上。
        # 下面任何 location 内都不要写 add_header：只要某一层出现一条，该层就不再继承这里的全部安全头。
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        # 最小 CSP：只含不影响脚本/样式/媒体/连接的三条指令，Next/AntD/hls.js 不受影响；
        # 完整 CSP 已推迟，另行评估。
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

        # 拒绝路径部分（第一个 ? 之前）含字面反斜杠或 '#' 的请求，否则登录严格桶可被绕过：
        #   nginx 在 Linux 上把 '\' 当普通字符留在 $uri 里，遇到 '#' 又会截断 $uri，所以
        #   "POST /api/v1/auth\login#" 的 $uri 是 /api/v1/auth\login，匹配不上下面的登录桶正则，
        #   只落进宽松的 api 桶；proxy_pass 原样转发原始 URI，后端 Express（parseurl 见到 '#'
        #   回退 url.parse）把 ?/# 之前的反斜杠改成 '/'，照样路由到登录 handler。
        # 浏览器不会在路径里发送字面 '\'（会规范成 '/'）或 '#'（片段不上送），正常流量不受影响；
        #   %5C / %23 编码形式与查询串里的 '\' 不受影响。
        # "\x5C" 是 PCRE 的十六进制转义（即反斜杠）：nginx 解析配置时只处理 \" \' \\ \t \r \n，\x 原样交给 PCRE。
        if ($request_uri ~ "^[^?]*[\x5C#]") {
            return 400;
        }

        # ── NestJS API ──────────────────────────────────────
        location /api/ {
            limit_req  zone=api burst=100 nodelay;
            error_page 429 = @rate_limited;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;

            # 登录/注册单独的严格桶。必须用 ~* 且容忍尾斜杠：Express 路由默认大小写不敏感
            # 且非 strict，/api/v1/AUTH/Login、/api/v1/auth/login/ 都会命中登录 handler（已实测）。
            # 嵌套 location 不继承 proxy_pass，必须重写；proxy_set_header/proxy_http_version/
            # proxy_read_timeout/error_page 从外层继承 —— 这里只要写任何一条 proxy_set_header，
            # 外层四条就全部失效，后端会把请求当成内网直连而豁免限流。
            # 本层的 limit_req 会覆盖外层 api 桶（login 桶更严，有意为之）。
            location ~* ^/api/v1/auth/(login|register)/?$ {
                limit_req  zone=login burst=5 nodelay;
                proxy_pass http://backend;
            }
        }

        # nginx 自身限流拒绝时的响应体，结构同后端 HttpExceptionFilter；
        # admin 的 axios 拦截器与 portal CommentSection 都读 .message。
        # 不开 proxy_intercept_errors，后端自己的 429 原样透传。
        location @rate_limited {
            default_type application/json;
            return 429 '{"success":false,"statusCode":429,"message":"请求过于频繁，请稍后再试"}';
        }

        location /uploads/ {
            proxy_pass       http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # 与其他 location 保持一致：后端靠代理头区分「经 nginx 的外部
            # 请求」与「Docker 内网的 SSR 直连」，缺了会被误判为内网请求
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires          7d;
            # 本 location 内不要写任何 add_header：只要当前层出现一条，
            # server 级安全头（XFO/nosniff/Referrer-Policy/CSP/HSTS）就全部不再继承。
            # expires 7d 自身输出 Cache-Control: max-age=604800（覆盖后端 express.static 的 public, max-age=0）。
        }

        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass         http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── 关闭 Next.js 图片优化器（纵深防御；portal 已 images.unoptimized）──
        # 前缀匹配 + ^~：覆盖 /_next/image、/_next/image/ 等全部变体（nginx 先解码/合并斜杠/
        # 处理 . 和 .. 再匹配），且不会被将来新增的正则 location 抢先命中；查询串不参与匹配。
        # 不要改成 "location = /_next/image"（精确匹配漏掉尾斜杠等变体）。
        location ^~ /_next/image { return 404; }

        location / {
            proxy_pass         http://portal;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
